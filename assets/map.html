<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Leaflet Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Geocoder plugin CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #info {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.8);
      padding: 12px 20px;
      font-size: 18px;
      border-radius: 8px;
      z-index: 1000;
      animation: wave 1.2s infinite ease-in-out;
      pointer-events: none;
    }
  
    @keyframes wave {
      0%   { transform: translate(-50%, -50%) scale(1); }
      50%  { transform: translate(-50%, -50%) scale(1.08); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="info">Click on map or search to drop a marker 🔽</div>

  <script>
    var map = L.map('map').setView([17.385044, 78.486671], 13);
    var marker;
    var bufferCircle;
    var selectedRadius = 100; // Default to 1km
    var markerLayerGroup = L.layerGroup().addTo(map);
    var greenIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });
    

    // 🌍 Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // ✅ Receive radius and coordinates from Flutter
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'move_to_location') {
        const lat = event.data.lat;
        const lon = event.data.lon;

        map.setView([lat, lon], 15);

      }

      if (event.data && event.data.type === 'add_markers') {
        const data = event.data.data || [];
      
        // 🧹 Clear previous markers
        markerLayerGroup.clearLayers();
      
        data.forEach(item => {
          const marker = L.marker([item.lat, item.lon], { icon: greenIcon });

          marker.bindPopup(item.name);
      
          marker.on('click', () => {
            window.parent.postMessage({
              type: 'marker_clicked',
              property: item.property
            }, "*");
          });
      
          markerLayerGroup.addLayer(marker); // 🔁 Add to group
        });
      }
      if (event.data && event.data.type === 'set_radius') {
        selectedRadius = event.data.radius;
        console.log("✅ Radius updated to: " + selectedRadius + " meters");

        if (marker) {
          const latlng = marker.getLatLng();
          drawBufferCircle(latlng.lat, latlng.lng);
        }
      }
    });

    // 📍 Auto locate user
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        var lat = position.coords.latitude;
        var lon = position.coords.longitude;
        map.setView([lat, lon], 14);

        // 🔁 Send to Flutter
        window.parent.postMessage({ type: 'user_location', lat: lat, lon: lon }, "*");
      });
    }

    // ✨ Click on map
    map.on('click', function(e) {
      const lat = e.latlng.lat;
      const lon = e.latlng.lng;

      if (marker) {
        marker.setLatLng([lat, lon]);
      } else {
        marker = L.marker([lat, lon]).addTo(map).bindPopup("Selected Point").openPopup();
      }

      // 🔁 Send clicked point to Flutter
      window.parent.postMessage({
        type: 'selected_point',
        lat: lat,
        lon: lon
      }, "*");
      drawBufferCircle(lat, lon);
        // ✅ Hide the "Click on map" message once marker is placed
      const infoDiv = document.getElementById('info');
      if (infoDiv) {
        infoDiv.style.display = 'none';
      }
    });

    // 🌀 Buffer circle drawer
    function drawBufferCircle(lat, lon) {
      if (bufferCircle) {
        map.removeLayer(bufferCircle);
      }

      bufferCircle = L.circle([lat, lon], {
        radius: selectedRadius,
        color: 'blue',
        fillColor: '#3399ff',
        fillOpacity: 0.3
      }).addTo(map);
    }
  </script>
</body>
</html>
